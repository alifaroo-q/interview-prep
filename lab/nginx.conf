# Gateway: round robin over three orders replicas, each reached through toxiproxy.
# One worker, so the round robin order is one sequence (each worker keeps its own).
worker_processes 1;
events {}
http {
upstream orders {
  server toxiproxy:21001 max_fails=1 fail_timeout=10s;
  server toxiproxy:21002 max_fails=1 fail_timeout=10s;
  server toxiproxy:21003 max_fails=1 fail_timeout=10s;
}
server {
  listen 80;
  location /api/orders {
    proxy_pass http://orders/;
    proxy_connect_timeout 1s;
    proxy_read_timeout 2s;
    proxy_next_upstream error timeout;
    add_header X-Upstream $upstream_addr always;
    add_header X-Upstream-Status $upstream_status always;
    add_header X-Upstream-Time $upstream_response_time always;
  }
  location = /health { return 200 "gateway ok\n"; }
}
}
