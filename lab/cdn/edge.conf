# CDN lab edge: a caching reverse proxy in front of cdn-origin. The edge reaches the origin over TLS through
# toxiproxy:22001, so labs can add distance (latency) or cut the origin off.
worker_processes 1;
events {}
http {
  proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=cdn:10m max_size=100m inactive=10m use_temp_path=off;
  limit_req_zone $binary_remote_addr zone=perip:1m rate=5r/s;
  # keepalive N: keep up to N idle origin connections for reuse. It does not cap how many can be open.
  # keepalive 0: no reuse, a new TCP + TLS connection for every request.
  # origin_slow: the same origin, through a toxiproxy port that labs make slow.
  # keepalive_timeout 30s: close a pooled connection after 30 s idle, before the origin (300 s) does.
  upstream origin_pool   { server toxiproxy:22001; keepalive 4; keepalive_timeout 30s; }
  upstream origin_slow   { server toxiproxy:22002; keepalive 4; keepalive_timeout 30s; }
  upstream origin_nopool { server toxiproxy:22001; keepalive 0; }
  upstream origin_h2     { server toxiproxy:22001; keepalive 4; keepalive_timeout 30s; }   # used with proxy_http_version 2
  server {
    listen 80;
    http2 on;   # clients may speak HTTP/1.1 or HTTP/2 (curl --http2-prior-knowledge)
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Cache key: host + path + query string, as the client sent it.
    proxy_cache_key $scheme://$host$request_uri;
    proxy_cache_revalidate on;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    add_header X-Cache $upstream_cache_status always;
    # Time to open the origin connection, TLS handshake included. 0.000 means a pooled connection was reused.
    add_header X-Edge-Connect $upstream_connect_time always;
    location = /edge-status { stub_status; }
    location / { proxy_cache cdn; proxy_pass https://origin_pool; }
    location /slow/ { proxy_cache cdn; proxy_pass https://origin_slow/; }
    location /slow-nolock/ { proxy_cache cdn; proxy_cache_lock off; proxy_pass https://origin_slow/; }
    location /nopool/ { proxy_pass https://origin_nopool/; }
    location /h2/ { proxy_http_version 2; proxy_pass https://origin_h2/; }
    # A "cache everything" rule: ignores the origin's Cache-Control and Set-Cookie. Unsafe on purpose.
    location /everything/ { proxy_cache cdn; proxy_ignore_headers Cache-Control Expires Set-Cookie; proxy_cache_valid 200 60s; proxy_pass https://origin_pool/; }
    location /limited/ { limit_req zone=perip burst=10 nodelay; limit_req_status 429; proxy_cache cdn; proxy_pass https://origin_pool/; }
  }
}
