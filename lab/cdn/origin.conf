# CDN lab origin: the server the edge fetches from. TLS on 443 (HTTP/1.1 and HTTP/2), plain HTTP on 80 for /status.
# Every response says which origin connection carried it ($connection) and how many requests that connection has served.
worker_processes 1;
events {}
http {
  # Longer than the edge keeps idle connections (30 s), so the edge, not the origin, closes them.
  keepalive_timeout 300s;
  map $http_accept_language $greet { default "Hello"; ~^de "Hallo"; ~^fr "Bonjour"; }
  server {
    listen 443 ssl;
    listen 80;
    http2 on;
    ssl_certificate /etc/nginx/cert.pem;
    ssl_certificate_key /etc/nginx/key.pem;
    ssl_protocols TLSv1.3;
    root /srv/www;
    include /etc/nginx/conn-headers.conf;
    # Static files: nginx adds ETag and Last-Modified itself; expires adds Cache-Control: max-age.
    # 10 s, so labs need not wait long. Real sites often cache static files for a year and change the name on deploy.
    location /static/ { expires 10s; include /etc/nginx/conn-headers.conf; }
    location /hello-vary { add_header Vary Accept-Language always; add_header Cache-Control "public, max-age=60" always; include /etc/nginx/conn-headers.conf; return 200 "$greet\n"; }
    location /hello-novary { add_header Cache-Control "public, max-age=60" always; include /etc/nginx/conn-headers.conf; return 200 "$greet\n"; }
    location /account { add_header Cache-Control "private, no-store" always; include /etc/nginx/conn-headers.conf; return 200 "Account page of $cookie_user\n"; }
    location /api/ { add_header Cache-Control "no-store" always; include /etc/nginx/conn-headers.conf; return 200 "$request_method $uri done by origin\n"; }
    location = /status { stub_status; }
  }
  # TCP/TLS lab: TLS 1.3 with 0-RTT early data on, to show early data and its replay. Not used by the CDN edge.
  server {
    listen 8443 ssl;
    ssl_certificate /etc/nginx/cert.pem;
    ssl_certificate_key /etc/nginx/key.pem;
    ssl_protocols TLSv1.3;
    ssl_early_data on;
    client_max_body_size 10m;   # the loss lab uploads 2 MB
    location / { return 200 "$request_method $uri done by origin, early data: $ssl_early_data, connection $connection\n"; }
  }
}
