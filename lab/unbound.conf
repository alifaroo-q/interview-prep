server:
  interface: 127.0.0.1
  access-control: 127.0.0.0/8 allow
  username: ""
  chroot: ""
  do-daemonize: yes
  verbosity: 0
  # Real recursion from the root, with a local zone for made-up names.
  local-zone: "acmeshop.test." static
  local-data: "acmeshop.test. 300 IN A 192.0.2.10"
  local-data: "www.acmeshop.test. 300 IN CNAME acmeshop.test."
  local-data: "acmeshop.test. 300 IN MX 10 mail.acmeshop.test."
  local-data: "mail.acmeshop.test. 300 IN A 192.0.2.25"
  local-data: 'acmeshop.test. 300 IN TXT "v=spf1 mx -all"'
  local-data: "acmeshop.test. 300 IN AAAA 2001:db8::10"
  local-data-ptr: "192.0.2.10 acmeshop.test."
remote-control:
  control-enable: yes
  control-interface: 127.0.0.1
  control-use-cert: no
